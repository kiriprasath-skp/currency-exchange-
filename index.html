<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Currency Exchange</title>
<meta name="description" content="Convert between world currencies using live reference exchange rates." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,420;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="sheet">
  <header class="sheet__head">
    <h1 class="brand">Currency Exchange</h1>
    <p class="brand__sub">Daily reference rates from the open market</p>
  </header>

  <form class="ledger" id="converter-form" autocomplete="off">

    <div class="row">
      <label class="row__label" for="amount">Amount</label>
      <div class="field">
        <input
          class="field__input"
          type="text"
          inputmode="decimal"
          id="amount"
          name="amount"
          value="1000"
          aria-label="Amount to convert"
        />
        <div class="field__select-wrap">
          <select class="field__select" id="from-currency" aria-label="From currency"></select>
        </div>
      </div>
    </div>

    <div class="swap-row">
      <div class="rule" aria-hidden="true"></div>
      <button class="swap" type="button" id="swap-btn" aria-label="Swap currencies" title="Swap currencies">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M7 7h11l-3.2-3.2 1.4-1.4L21.8 7 16.2 12.6l-1.4-1.4L18 8H7V7z" fill="currentColor"/>
          <path d="M17 17H6l3.2 3.2-1.4 1.4L2.2 17 7.8 11.4l1.4 1.4L6 16h11v1z" fill="currentColor"/>
        </svg>
      </button>
      <div class="rule" aria-hidden="true"></div>
    </div>

    <div class="row">
      <label class="row__label" id="result-label">Converted amount</label>
      <div class="field field--result">
        <div class="flap-display" id="flap-display" aria-live="polite" aria-labelledby="result-label"></div>
        <div class="field__select-wrap">
          <select class="field__select" id="to-currency" aria-label="To currency"></select>
        </div>
      </div>
    </div>

    <p class="rate-line" id="rate-line">Loading today&rsquo;s rates&hellip;</p>

    <div class="chips" id="quick-pairs" role="group" aria-label="Quick currency pairs"></div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>

  <footer class="sheet__foot">
    <button type="button" id="copy-btn" class="link-btn">Copy result</button>
    <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer">Rates by ExchangeRate&#8209;API</a>
  </footer>
</main>

<script src="script.js" defer></script>
</body>
</html>
